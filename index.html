<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Official support and information for PachNeko on iPhone and iPad.">
  <title>PachNeko — Support</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
  <script src="site.js" defer></script>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="index.html" data-lang-link><img src="icon.png" alt=""><strong>PachNeko</strong></a>
      <label><span class="visually-hidden">Language</span><select id="language" aria-label="Language">
        <option value="fr">Français</option><option value="en">English</option><option value="ja">日本語</option>
        <option value="zh">简体中文</option><option value="es">Español</option><option value="it">Italiano</option><option value="de">Deutsch</option>
      </select></label>
    </header>
    <main>
      <section class="hero"><img src="icon.png" alt="PachNeko"><div><h1>PachNeko</h1><p class="lede" data-i18n="tagline">Kawaii pachinko, jackpots, and mechanical cats.</p></div></section>
      <section class="grid">
        <article class="card wide"><h2 data-i18n="aboutTitle">About</h2><p data-i18n="about"></p></article>
        <article class="card"><h2 data-i18n="helpTitle">Need help?</h2><p><span data-i18n="help"></span> <a href="mailto:nicolas@sent.com">nicolas@sent.com</a>.</p></article>
        <article class="card"><h2 data-i18n="resetTitle">Reset the game</h2><p data-i18n="reset"></p></article>
        <article class="card wide"><h2 data-i18n="offlineTitle">Built for privacy</h2><p data-i18n="offline"></p></article>
      </section>
    </main>
    <footer><nav><a href="index.html" data-lang-link data-i18n="support">Support</a><a href="privacy.html" data-lang-link data-i18n="privacy">Privacy</a><a href="licenses.html" data-lang-link data-i18n="licenses">Licenses</a></nav></footer>
  </div>
</body>
</html>
